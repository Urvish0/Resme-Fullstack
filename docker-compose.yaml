version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: resme-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: . 
      dockerfile: backend/Dockerfile 
    container_name: resme-backend 
    ports:
      - "8000:8000"
    env_file:
      - .env 
    environment:
      REDIS_HOST: redis 
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

    
      