version: '3.9'

services:
  redis:
    image: redis:7-alpine
    container_name: resme-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend 
      dockerfile: Dockerfile 
    container_name: resme-backend 
    ports:
      - "8000:8000"
    env_file:
      - .env 
    environment:
      REDIS_HOST: redis 
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build: 
      context: ./frontend 
      dockerfile: dockerfile
    container_name: resme-frontend 
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    
      