name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov

      - name: Auto-format code (ruff)
        run: ruff format backend

      - name: Auto-fix linting issues (ruff)
        run: ruff check backend --fix

      - name: Type check (mypy)
        run: mypy backend --ignore-missing-imports || true

      - name: Lint check (ruff)
        run: ruff check backend
        continue-on-error: false

      - name: Run tests (pytest)
        run: pytest backend/tests -v --tb=short 2>/dev/null || echo "No tests found (optional)"

      - name: Build Docker image (backend)
        run: docker build -t resme-backend:latest -f backend/Dockerfile backend/

      - name: Validate Docker build
        run: docker inspect resme-backend:latest > /dev/null && echo "✓ Docker image built successfully"