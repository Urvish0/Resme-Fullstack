name: Backend CI 

on:
  push: 
    branches: [ main ]
  pull_request: 
    branches: [ main ]

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff backend 

      - name: Docker build (backend)
        run: |
          docker build -t resme-backend -f backend/Dockerfile .